/right/controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rizon_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    flexiv_robot_states_broadcaster:
      type: flexiv_robot_states_broadcaster/FlexivRobotStatesBroadcaster

    gpio_controller:
      type: gpio_controller/GPIOController

    cartesian_motion_force_controller:
      type: cartesian_motion_force_controller/CartesianMotionForceController

    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

/right/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints:
      - $(var prefix_right)joint1
      - $(var prefix_right)joint2
      - $(var prefix_right)joint3
      - $(var prefix_right)joint4
      - $(var prefix_right)joint5
      - $(var prefix_right)joint6
      - $(var prefix_right)joint7
    interfaces: [position, velocity, effort]

/right/rizon_arm_controller:
  ros__parameters:
    joints:
      - $(var prefix_right)joint1
      - $(var prefix_right)joint2
      - $(var prefix_right)joint3
      - $(var prefix_right)joint4
      - $(var prefix_right)joint5
      - $(var prefix_right)joint6
      - $(var prefix_right)joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

/right/flexiv_robot_states_broadcaster:
  ros__parameters:
    robot_sn: $(var robot_name_right)

/right/gpio_controller:
  ros__parameters:
    robot_sn: $(var robot_name_right)

/right/cartesian_motion_force_controller:
  ros__parameters:
    prefixes: [$(var prefix_right)]

/right/cartesian_compliance_controller:
  ros__parameters:
    ik_solver: forward_dynamics
    end_effector_link: $(var prefix_right)flange
    robot_base_link: $(var prefix_right)base_link
    ft_sensor_ref_link: $(var prefix_right)flange
    ft_sensor_topic_name: /right_Rizon4_063116/ft_sensor_wrench
    compliance_ref_link: $(var prefix_right)flange
    force_enable: false
    gravity_compensation: false
    force_state_pub: false
    emergency_stop_threshold: 200.0
    joints:
      - $(var prefix_right)joint1
      - $(var prefix_right)joint2
      - $(var prefix_right)joint3
      - $(var prefix_right)joint4
      - $(var prefix_right)joint5
      - $(var prefix_right)joint6
      - $(var prefix_right)joint7
    command_interfaces: [position]

    stiffness:
      trans_x: 200.0
      trans_y: 200.0
      trans_z: 200.0
      rot_x: 200.0
      rot_y: 200.0
      rot_z: 200.0

    damping:
      trans_x: 1.0
      trans_y: 1.0
      trans_z: 1.0
      rot_x: 0.0
      rot_y: 0.0
      rot_z: 0.0

    solver:
      forward_dynamics:
        link_mass: 10.0
      error_scale: 0.2
      iterations: 3
      publish_state_feedback: true

    pd_gains:
      trans_x: {p: 1.2, d: 0.005}
      trans_y: {p: 1.2, d: 0.005}
      trans_z: {p: 1.2, d: 0.005}
      rot_x: {p: 1.0, d: 0.0001}
      rot_y: {p: 1.0, d: 0.0001}
      rot_z: {p: 1.0, d: 0.0001}
